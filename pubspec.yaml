name: network_monitorong
description: "Enterprise-Grade Network Management System for Hospitals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # Local Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Code Generation Support
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # Functional Programming
  dartz: ^0.10.1

  # Equality
  equatable: ^2.0.7

  # Localization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Logging
  logger: ^2.5.0

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  window_manager: ^0.4.3
  system_theme: ^3.1.2
  responsive_framework: ^1.5.1
  flutter_svg: ^2.0.17

  # Utils
  connectivity_plus: ^6.1.2
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^3.0.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.5

  # Testing
  mockito: ^5.4.6
  mocktail: ^1.0.4
  faker: ^2.2.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
